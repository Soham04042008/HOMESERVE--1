
spring.application.name=homeserve-backend

# Aiven Cloud MySQL
spring.datasource.url=jdbc:mysql://homeserve-mysql-soham-690a.f.aivencloud.com:10277/homeserve_db?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server
server.port=8080


# HomeServe performance: reuse healthy cloud DB connections and fail promptly on a stuck connection.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=540000
spring.datasource.hikari.keepalive-time=300000

